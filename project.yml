name: PocketBridge
options:
  minimumXcodeGenVersion: '2.46.0'
  xcodeVersion: '26.6'
  developmentLanguage: en
  bundleIdPrefix: app.pocketbridge
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    POCKETBRIDGE_URL_SCHEME: pocketbridge
targets:
  PocketBridge:
    type: application
    platform: iOS
    sources:
      - path: PocketBridge
        excludes:
          - Info.plist
          - PocketBridge.entitlements
          - PocketBridgeAI.plist
          - Keys
          - VoiceModel
      - path: PocketBridge/VoiceModel
        type: folder
        buildPhase: resources
      # Your provider keys go in Keys/PocketBridgeAI.plist (gitignored). See README.
      - path: PocketBridge/Keys
        type: folder
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: PocketBridge/PocketBridge.entitlements
        CURRENT_PROJECT_VERSION: '1'
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PocketBridge/Info.plist
        MARKETING_VERSION: '1.0'
        PRODUCT_BUNDLE_IDENTIFIER: app.pocketbridge.ios
        PRODUCT_NAME: '$(TARGET_NAME)'
        TARGETED_DEVICE_FAMILY: '1'
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
  PocketBridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PocketBridgeTests
    dependencies:
      - target: PocketBridge
    settings:
      base:
        BUNDLE_LOADER: '$(TEST_HOST)'
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.pocketbridge.ios.tests
        PRODUCT_NAME: '$(TARGET_NAME)'
        TARGETED_DEVICE_FAMILY: '1'
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/PocketBridge.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PocketBridge'
